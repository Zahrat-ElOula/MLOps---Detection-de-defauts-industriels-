apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-defect-api
  labels:
    app: industrial-defect-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: industrial-defect-api
  template:
    metadata:
      labels:
        app: industrial-defect-api
    spec:
      containers:
        - name: api
          # CD overrides this tag with the immutable <sha> tag after `kind load`.
          image: ghcr.io/zahrat-eloula/mlops---detection-de-defauts-industriels--api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: API_MODEL_PATH
              value: /app/model_registry/model.onnx
            - name: API_MODEL_BACKEND
              value: auto
            - name: LOG_JSON
              value: "1"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      restartPolicy: Always
