# Plumbing smoke-test thresholds for the tiny CT fixture.
# The CT held-out split has only four images and the model is retrained for two
# epochs, so its binary metrics are not a reliable quality signal. These floors
# only catch a broken/empty evaluation; production quality is gated by
# configs/alerting.yaml and model_registry/baseline_metrics.json.
accuracy_threshold: 0.25
f1_threshold: 0.0
mAP_threshold: 0.0
drift_threshold: 0.30
