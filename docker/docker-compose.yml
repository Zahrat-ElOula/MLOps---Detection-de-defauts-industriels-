# Local stack: FastAPI backend + React frontend.
# Run from the repository root:
#   docker compose -f docker/docker-compose.yml up --build
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: industrial-defect-detection/api:latest
    container_name: idd-api
    ports:
      - "8000:8000"
    environment:
      API_MODEL_PATH: /app/model_registry/model.onnx
      API_MODEL_BACKEND: auto
      LOG_JSON: "1"
    volumes:
      - ../model_registry:/app/model_registry:ro
      - ../data/feedback:/app/data/feedback 
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8000
    image: industrial-defect-detection/frontend:latest
    container_name: idd-frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
