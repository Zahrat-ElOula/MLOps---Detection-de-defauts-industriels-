# Training hyperparameters for industrial-defect-detection.
# All values are intentionally conservative defaults for a first baseline run.
model_name: resnet18
lr: 0.001
batch_size: 32
epochs: 20
image_size: 224
# Kept for backward compatibility. The effective class count is inferred from
# data/raw/<category>/test sub-directories and saved to model_registry/classes.json.
num_classes: 4
early_stopping_patience: 5
device: auto
category: bottle
data_root: data/raw