name: CT - Retrain on new data

on:
  push:
    paths:
      - 'data/feedback/**'
  workflow_dispatch:

concurrency:
  group: ct-retrain
  cancel-in-progress: false

jobs:
  retrain:
    name: Retrain and non-regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare mini dataset for retraining
        run: |
          # Créer la structure attendue par MVTecDataset
          mkdir -p data/raw/bottle/train/good
          mkdir -p data/raw/bottle/test/good
          mkdir -p data/raw/bottle/test/broken_large
          # Copier les images de référence (good)
          cp data/mini_ref/good/*.png data/raw/bottle/train/good/ 2>/dev/null || true
          cp data/mini_ref/good/*.png data/raw/bottle/test/good/ 2>/dev/null || true
          # Copier les feedbacks comme images "defect" (pour simuler)
          cp data/feedback/*.png data/raw/bottle/test/broken_large/ 2>/dev/null || true
          # Copier aussi dans train (pour que le classifieur voie des défauts)
          cp data/feedback/*.png data/raw/bottle/train/ 2>/dev/null || true
          ls -la data/raw/bottle/train/good/ | head -5

      - name: Retrain model
        run: python pipelines/train_pipeline.py --params configs/params.yaml --override epochs=2

      - name: Non-regression tests
        run: pytest tests/test_regression.py -v --maxfail=1

      - name: Upload run artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrain-artifacts
          path: |
            model_registry/
            reports/
          retention-days: 14

      - name: Commit updated metrics
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model_registry/baseline_metrics.json model_registry/train_metrics.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ct: retrain model on new data [skip ci]"
          git push