name: CT - Retrain on new data

on:
  push:
    paths:
      - "data/new_data/**"
  workflow_dispatch:
    inputs:
      reason:
        description: Why this retraining is triggered
        required: false
        default: manual

concurrency:
  group: ct-retrain
  cancel-in-progress: false

jobs:
  retrain:
    name: Retrain and non-regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Track new data with DVC
        run: |
          dvc init --force || true
          dvc add data/raw || true
          dvc add data/new_data || true

      - name: Retrain model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: python pipelines/train_pipeline.py --params configs/params.yaml

      - name: Non-regression tests
        run: pytest tests/test_regression.py -v --maxfail=1

      - name: Upload run artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrain-artifacts
          path: |
            model_registry/
            reports/
          retention-days: 14

      - name: Commit updated metrics and DVC metadata
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model_registry/baseline_metrics.json model_registry/train_metrics.json data/*.dvc 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ct: retrain model on new data [skip ci]"
          git push
