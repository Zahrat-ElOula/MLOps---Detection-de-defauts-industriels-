name: CT - Retrain on new data

on:
  push:
    paths:
      - 'data/feedback/**'
  repository_dispatch:
    types: [feedback-received]
  schedule:
    - cron: "0 3 * * *"  # Every day at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ct-retrain
  cancel-in-progress: true

jobs:
  retrain:
    name: Retrain and non-regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check new feedback
        id: check
        run: |
          image_count=$(find data/feedback -maxdepth 1 -type f \
            \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \
               -o -name '*.bmp' -o -name '*.tif' -o -name '*.tiff' \) \
            2>/dev/null | wc -l)
          echo "count=$image_count" >> "$GITHUB_OUTPUT"

          # Push and repository_dispatch are explicit CT requests: run them.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Event '${{ github.event_name }}'; feedback images: $image_count"
            exit 0
          fi

          # Scheduled safety net: only retrain for files not consumed by the
          # previous successful CT run.
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          feedback_dir = Path("data/feedback")
          marker_path = Path("model_registry/ct/last_feedback.json")

          current = sorted(
              path.name
              for path in feedback_dir.iterdir()
              if path.is_file() and not path.name.startswith(".")
          ) if feedback_dir.is_dir() else []

          consumed = set()
          if marker_path.is_file():
              try:
                  marker = json.loads(marker_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  marker = {}
              if isinstance(marker, dict):
                  marker = marker.get("files", [])
              if isinstance(marker, list):
                  consumed = {str(name) for name in marker}

          new_files = [name for name in current if name not in consumed]
          run = "true" if new_files else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run={run}\n")
              handle.write(f"new_count={len(new_files)}\n")
          print(f"New feedback files since last CT: {len(new_files)}")
          for name in new_files:
              print(f"  - {name}")
          if not new_files:
              print("Scheduled run skipped: no new feedback since last CT.")
          PY

      - name: Set up Python 3.11
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare mini dataset for retraining
        if: steps.check.outputs.run == 'true'
        run: |
          # Minimal MVTec layout expected by MVTecDataset.
          rm -rf data/raw/bottle
          mkdir -p model_registry/ct
          # Keep the dedicated CT baseline; remove only generated CT artefacts.
          find model_registry/ct -mindepth 1 -maxdepth 1 \
            ! -name 'baseline_metrics.json' -exec rm -rf {} +
          mkdir -p data/raw/bottle/train/good
          mkdir -p data/raw/bottle/test/good

          # Keep train/good and test/good disjoint: copying the same good
          # images to both would leak held-out files into training.
          i=0
          for f in data/mini_ref/good/*.png; do
            [ -e "$f" ] || continue
            i=$((i + 1))
            if [ "$i" -le 3 ]; then
              cp "$f" data/raw/bottle/train/good/
            else
              cp "$f" data/raw/bottle/test/good/
            fi
          done

          # One reference folder per defect type.
          for cls in broken_large broken_small contamination; do
            mkdir -p "data/raw/bottle/test/$cls"
            cp "data/mini_ref/$cls/"*.png "data/raw/bottle/test/$cls/" 2>/dev/null || true
          done

          # Feedback images are routed using their .txt label.
          # Legacy "defect" labels are accepted by the API but ignored here.
          for f in data/feedback/*.png data/feedback/*.jpg data/feedback/*.jpeg data/feedback/*.bmp; do
            [ -e "$f" ] || continue
            base="${f%.*}"
            label="$(cat "${base}.txt" 2>/dev/null || true)"
            case "$label" in
              good|broken_large|broken_small|contamination)
                mkdir -p "data/raw/bottle/test/$label"
                cp "$f" "data/raw/bottle/test/$label/"
                ;;
              defect|"")
                echo "Skipping legacy/empty feedback: $f"
                ;;
              *)
                echo "Skipping unknown label '$label': $f"
                ;;
            esac
          done

          find data/raw/bottle -maxdepth 3 -type f | sort | head -20

      - name: Ensure dedicated CT baseline
        if: steps.check.outputs.run == 'true'
        run: |
          if [ ! -f model_registry/ct/baseline_metrics.json ]; then
            cp data/mini_ref/baseline_metrics.json \
              model_registry/ct/baseline_metrics.json
          fi

      - name: Retrain model with a dedicated CT split
        if: steps.check.outputs.run == 'true'
        run: |
          python pipelines/train_pipeline.py \
            --params configs/params.yaml \
            --output-dir model_registry/ct \
            --split-path model_registry/ct/split.json \
            --override epochs=2

      - name: Evaluate retrained model on held-out CT split
        if: steps.check.outputs.run == 'true'
        run: |
          python -m src.models.evaluate \
            --model-dir model_registry/ct \
            --split-path model_registry/ct/split.json \
            --metrics-path model_registry/ct/test_metrics.json \
            --baseline-path model_registry/ct/baseline_metrics.json \
            --alerting-path data/mini_ref/alerting.yaml \
            --no-update-baseline

      - name: Non-regression tests
        if: steps.check.outputs.run == 'true'
        env:
          MODEL_DIR: model_registry/ct
          SPLIT_PATH: model_registry/ct/split.json
          CURRENT_METRICS_PATH: model_registry/ct/test_metrics.json
          BASELINE_PATH: model_registry/ct/baseline_metrics.json
          ALERTING_PATH: data/mini_ref/alerting.yaml
          CLASSES_PATH: model_registry/ct/classes.json
          REQUIRE_SPLIT_MANIFEST: "1"
          REQUIRE_SPLIT_METRICS: "1"
        run: pytest tests/test_regression.py -v --maxfail=1

      - name: Record consumed feedback
        if: success() && steps.check.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          feedback_dir = Path("data/feedback")
          marker_path = Path("model_registry/ct/last_feedback.json")
          marker_path.parent.mkdir(parents=True, exist_ok=True)

          files = sorted(
              path.name
              for path in feedback_dir.iterdir()
              if path.is_file() and not path.name.startswith(".")
          ) if feedback_dir.is_dir() else []

          payload = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "files": files,
          }
          marker_path.write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          print(f"Recorded {len(files)} consumed feedback files.")
          PY

      - name: Upload run artefacts
        if: always() && steps.check.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: retrain-artifacts
          path: |
            model_registry/ct/
            reports/
          retention-days: 14

      - name: Commit updated metrics
        if: success() && steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model_registry/ct/baseline_metrics.json \
                  model_registry/ct/classes.json \
                  model_registry/ct/split.json \
                  model_registry/ct/train_metrics.json \
                  model_registry/ct/test_metrics.json \
                  model_registry/ct/last_feedback.json
          git diff --cached --quiet || git commit -m "ct: retrain model on new data [skip ci]"
          git push
