name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
          python -m pip install --upgrade pip
          # 1. Installer PyTorch version CPU-only (plus léger, évite les timeouts)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # 2. Installer le reste des dépendances
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests -v --maxfail=1

      - name: Compile check
        run: python -m compileall -q src pipelines tests
