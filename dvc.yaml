# DVC pipeline definition.
# Stages: training (checkpoints + metrics) then evaluation (baseline metrics,
# plots and performance alerts).
stages:
  train:
    cmd: python pipelines/train_pipeline.py --params configs/params.yaml
    deps:
      - src/
      - pipelines/train_pipeline.py
      - data/raw
    params:
      - configs/params.yaml:
          - model_name
          - lr
          - batch_size
          - epochs
          - image_size
          - num_classes
          - early_stopping_patience
    outs:
      - model_registry/model.pt:
          cache: false
      - model_registry/split.json:
          cache: false
    metrics:
      - model_registry/train_metrics.json:
          cache: false
  evaluate:
    cmd: python -m src.models.evaluate
    deps:
      - src/
      - model_registry/model.pt
      - model_registry/split.json
      - data/raw
    metrics:
      - model_registry/baseline_metrics.json:
          cache: false
    plots:
      - reports/figures
